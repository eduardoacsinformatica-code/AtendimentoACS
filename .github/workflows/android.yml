name: Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'URL do backend Vercel'
        required: true
        default: 'https://atendimento-acs.vercel.app'
        type: string

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android branch
        uses: actions/checkout@v4
        with:
          ref: android-capacitor

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Configure API URL
        run: echo "VITE_API_BASE_URL=${{ inputs.api_url }}" >> "$GITHUB_ENV"

      - name: Build web assets
        run: npm run build:web

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AtendimentoACS-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
